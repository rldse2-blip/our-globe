
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR GLOBE — Own Your Pixel</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, rgba(5,10,15,.96), transparent);
  pointer-events: none;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 3px;
}

.logo span { color: #69b88b; }

.header-text {
  font-size: 11px;
  color: #a9b8c4;
  letter-spacing: 2px;
}

#map {
  width: 100vw;
  height: 100vh;
  background: #132b3c;
}

#pixelCanvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 500;
  pointer-events: none;
}

.panel {
  position: absolute;
  z-index: 1000;
  left: 18px;
  bottom: 20px;
  width: 280px;
  max-height: 75vh;
  overflow-y: auto;
  padding: 17px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 13px;
  background: rgba(7,14,21,.95);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.panel-title {
  font-size: 12px;
  letter-spacing: 2px;
  color: #9aabb9;
  margin-bottom: 13px;
}

.stat {
  display: flex;
  justify-content: space-between;
  margin: 9px 0;
  font-size: 13px;
}

.stat strong { color: #79d5a0; }

.total {
  border-top: 1px solid #293743;
  margin-top: 13px;
  padding-top: 13px;
  font-size: 15px;
}

.section-label {
  display: block;
  font-size: 11px;
  color: #9aabb9;
  letter-spacing: 1px;
  margin: 15px 0 8px;
}

select {
  width: 100%;
  padding: 11px;
  border-radius: 7px;
  border: 1px solid #354754;
  background: #17242e;
  color: white;
  font-size: 13px;
}

.flag-preview {
  display: flex;
  width: 100%;
  height: 42px;
  margin-top: 10px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 4px;
  overflow: hidden;
}

.flag-preview canvas {
  width: 100%;
  height: 100%;
}

button.action {
  width: 100%;
  border: 0;
  border-radius: 7px;
  padding: 12px;
  margin-top: 12px;
  font-weight: bold;
  cursor: pointer;
}

.clear {
  background: #263642;
  color: white;
}

.buy {
  background: #75c997;
  color: #07130c;
}

.hint {
  font-size: 11px;
  color: #9aaab6;
  line-height: 1.5;
  margin-top: 12px;
}

#zoomStatus {
  color: #79d5a0;
  margin-top: 8px;
  font-size: 11px;
}

@media(max-width:600px) {
  header { padding: 13px; }
  .logo { font-size: 17px; }
  .header-text { font-size: 8px; }

  .panel {
    left: 10px;
    bottom: 12px;
    width: 245px;
    max-height: 65vh;
    padding: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OUR <span>GLOBE</span></div>
  <div class="header-text">ONE GLOBE. MILLIONS OF OWNERS.</div>
</header>

<div id="map"></div>
<canvas id="pixelCanvas"></canvas>

<div class="panel">
  <div class="panel-title">YOUR PIXELS</div>

  <div class="stat">
    <span>Total pixels</span>
    <strong>10,000,000</strong>
  </div>

  <div class="stat">
    <span>Pixel price</span>
    <strong>€0.10</strong>
  </div>

  <div class="stat">
    <span>Selected</span>
    <strong id="selected">0</strong>
  </div>

  <div class="stat total">
    <span>Total price</span>
    <strong id="price">€0.00</strong>
  </div>

  <label class="section-label" for="countrySelect">
    CHOOSE A COUNTRY FLAG
  </label>

  <select id="countrySelect"></select>

  <div class="flag-preview">
    <canvas id="flagPreview" width="300" height="120"></canvas>
  </div>

  <button class="action clear" onclick="clearSelection()">
    CLEAR SELECTION
  </button>

  <button class="action buy" onclick="showBuyMessage()">
    BUY PIXELS
  </button>

  <div class="hint">
    Select a country flag and tap a square on the map. Every selected pixel displays the complete flag.
  </div>

  <div id="zoomStatus">Zoom in to see individual pixels</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =====================================
   OUR GLOBE — PIXEL SYSTEM
===================================== */

const GRID_WIDTH = 3162;
const GRID_HEIGHT = 3163;
const TOTAL_PIXELS = 10000000;

const WORLD_SIZE = 256;
const CELL_SIZE = WORLD_SIZE / GRID_WIDTH;
const PIXEL_PRICE = 0.10;

/*
  3162 x 3162 = 9,998,244
  Last row = 1,756 pixels
  Total = exactly 10,000,000
*/

const selectedPixels = new Map();

let selectedCountry = "RO";
let drawRequested = false;

/* =====================================
   FLAG DESIGNS
===================================== */

const flags = {
  RO: {
    name: "🇷🇴 Romania",
    type: "vertical",
    colors: ["#002B7F", "#FCD116", "#CE1126"]
  },

  HU: {
    name: "🇭🇺 Hungary",
    type: "horizontal",
    colors: ["#CE2939", "#FFFFFF", "#477050"]
  },

  FR: {
    name: "🇫🇷 France",
    type: "vertical",
    colors: ["#0055A4", "#FFFFFF", "#EF4135"]
  },

  DE: {
    name: "🇩🇪 Germany",
    type: "horizontal",
    colors: ["#000000", "#DD0000", "#FFCE00"]
  },

  IT: {
    name: "🇮🇹 Italy",
    type: "vertical",
    colors: ["#009246", "#FFFFFF", "#CE2B37"]
  },

  ES: {
    name: "🇪🇸 Spain",
    type: "horizontal",
    colors: ["#AA151B", "#F1BF00", "#AA151B"],
    ratios: [1, 2, 1]
  },

  NL: {
    name: "🇳🇱 Netherlands",
    type: "horizontal",
    colors: ["#AE1C28", "#FFFFFF", "#21468B"]
  },

  UA: {
    name: "🇺🇦 Ukraine",
    type: "horizontal",
    colors: ["#0057B7", "#FFD700"]
  },

  PL: {
    name: "🇵🇱 Poland",
    type: "horizontal",
    colors: ["#FFFFFF", "#DC143C"]
  },

  JP: {
    name: "🇯🇵 Japan",
    type: "japan",
    colors: ["#FFFFFF", "#BC002D"]
  },

  AT: {
    name: "🇦🇹 Austria",
    type: "horizontal",
    colors: ["#ED2939", "#FFFFFF", "#ED2939"]
  },

  BG: {
    name: "🇧🇬 Bulgaria",
    type: "horizontal",
    colors: ["#FFFFFF", "#00966E", "#D62612"]
  },

  RU: {
    name: "🇷🇺 Russia",
    type: "horizontal",
    colors: ["#FFFFFF", "#0039A6", "#D52B1E"]
  },

  IE: {
    name: "🇮🇪 Ireland",
    type: "vertical",
    colors: ["#169B62", "#FFFFFF", "#FF883E"]
  },

  BE: {
    name: "🇧🇪 Belgium",
    type: "vertical",
    colors: ["#000000", "#FAE042", "#ED2939"]
  },

  CZ: {
    name: "🇨🇿 Czech Republic",
    type: "horizontal",
    colors: ["#FFFFFF", "#D7141A"]
  },

  SE: {
    name: "🇸🇪 Sweden",
    type: "cross",
    colors: ["#006AA7", "#FECC00"]
  },

  CH: {
    name: "🇨🇭 Switzerland",
    type: "swiss",
    colors: ["#FF0000", "#FFFFFF"]
  }
};

/* =====================================
   FLAG DRAWING
===================================== */

function drawFlag(ctx, x, y, width, height, flag) {
  ctx.save();

  ctx.beginPath();
  ctx.rect(x, y, width, height);
  ctx.clip();

  if (flag.type === "japan") {
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(x, y, width, height);

    ctx.fillStyle = "#BC002D";
    ctx.beginPath();
    ctx.arc(
      x + width / 2,
      y + height / 2,
      Math.min(width, height) * 0.27,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  else if (flag.type === "cross") {
    ctx.fillStyle = flag.colors[0];
    ctx.fillRect(x, y, width, height);

    ctx.fillStyle = flag.colors[1];
    ctx.fillRect(x + width * 0.30, y, width * 0.13, height);
    ctx.fillRect(x, y + height * 0.43, width, height * 0.15);
  }

  else if (flag.type === "swiss") {
    ctx.fillStyle = flag.colors[0];
    ctx.fillRect(x, y, width, height);

    ctx.fillStyle = flag.colors[1];
    ctx.fillRect(x + width * 0.4, y + height * 0.2, width * 0.2, height * 0.6);
    ctx.fillRect(x + width * 0.2, y + height * 0.4, width * 0.6, height * 0.2);
  }

  else if (flag.type === "vertical") {
    const stripeWidth = width / flag.colors.length;

    flag.colors.forEach((color, index) => {
      ctx.fillStyle = color;
      ctx.fillRect(
        x + index * stripeWidth,
        y,
        stripeWidth + 0.5,
        height
      );
    });
  }

  else {
    const ratios = flag.ratios || flag.colors.map(() => 1);
    const total = ratios.reduce((a, b) => a + b, 0);

    let currentY = y;

    flag.colors.forEach((color, index) => {
      const stripeHeight = height * ratios[index] / total;

      ctx.fillStyle = color;
      ctx.fillRect(
        x,
        currentY,
        width,
        stripeHeight + 0.5
      );

      currentY += stripeHeight;
    });
  }

  ctx.restore();
}

/* =====================================
   MAP
===================================== */

const map = L.map("map", {
  center: [25, 10],
  zoom: 2,
  minZoom: 2,
  maxZoom: 17,
  worldCopyJump: true
});

L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Map style: <a href="https://opentopomap.org">OpenTopoMap</a>',
    subdomains: "abc"
  }
).addTo(map);

/* =====================================
   CANVAS
===================================== */

const canvas = document.getElementById("pixelCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const size = map.getSize();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(size.x * dpr);
  canvas.height = Math.round(size.y * dpr);

  canvas.style.width = size.x + "px";
  canvas.style.height = size.y + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawPixels();
}

function requestDraw() {
  if (drawRequested) return;

  drawRequested = true;

  requestAnimationFrame(() => {
    drawRequested = false;
    drawPixels();
  });
}

/* =====================================
   PIXEL COORDINATES
===================================== */

function coordinatesToPixel(latlng) {
  const point = map.project(latlng, 0);

  const x = ((point.x % WORLD_SIZE) + WORLD_SIZE) % WORLD_SIZE;
  const y = point.y;

  const col = Math.floor(x / CELL_SIZE);
  const row = Math.floor(y / CELL_SIZE);

  if (
    col < 0 ||
    col >= GRID_WIDTH ||
    row < 0 ||
    row >= GRID_HEIGHT
  ) {
    return null;
  }

  const id = row * GRID_WIDTH + col;

  if (id >= TOTAL_PIXELS) return null;

  return id;
}

function pixelScreenBounds(id, world) {
  const row = Math.floor(id / GRID_WIDTH);
  const col = id % GRID_WIDTH;

  const x = col * CELL_SIZE + world * WORLD_SIZE;
  const y = row * CELL_SIZE;

  const topLeft = map.latLngToContainerPoint(
    map.unproject(L.point(x, y), 0)
  );

  const bottomRight = map.latLngToContainerPoint(
    map.unproject(
      L.point(x + CELL_SIZE, y + CELL_SIZE), 0
    )
  );

  return {
    x: topLeft.x,
    y: topLeft.y,
    width: bottomRight.x - topLeft.x,
    height: bottomRight.y - topLeft.y
  };
}

/* =====================================
   DRAW PIXELS
===================================== */

function drawPixels() {
  const size = map.getSize();

  ctx.clearRect(0, 0, size.x, size.y);

  const bounds = map.getPixelBounds(0);

  const minX = bounds.min.x;
  const maxX = bounds.max.x;
  const minY = Math.max(0, bounds.min.y);
  const maxY = Math.min(
    CELL_SIZE * GRID_HEIGHT,
    bounds.max.y
  );

  if (minY >= maxY) return;

  const firstRow = Math.max(
    0,
    Math.floor(minY / CELL_SIZE)
  );

  const lastRow = Math.min(
    GRID_HEIGHT - 1,
    Math.floor(maxY / CELL_SIZE)
  );

  const screenCellSize =
    CELL_SIZE * Math.pow(2, map.getZoom());

  const zoomStatus = document.getElementById("zoomStatus");

  // Always show selected flags when visible.
  for (const [id, countryCode] of selectedPixels) {
    const flag = flags[countryCode];
    if (!flag) continue;

    const col = id % GRID_WIDTH;
    const row = Math.floor(id / GRID_WIDTH);

    const baseX = col * CELL_SIZE;
    const baseY = row * CELL_SIZE;

    const firstWorld = Math.floor(
      (minX - baseX - CELL_SIZE) / WORLD_SIZE
    );

    const lastWorld = Math.ceil(
      (maxX - baseX + CELL_SIZE) / WORLD_SIZE
    );

    for (let world = firstWorld; world <= lastWorld; world++) {
      const rect = pixelScreenBounds(id, world);

      if (
        rect.x + rect.width < 0 ||
        rect.y + rect.height < 0 ||
        rect.x > size.x ||
        rect.y > size.y
      ) {
        continue;
      }

      if (rect.width > 0 && rect.height > 0) {
        drawFlag(
          ctx,
          rect.x,
          rect.y,
          rect.width,
          rect.height,
          flag
        );
      }
    }
  }

  // Draw grid only when cells are large enough to see.
  if (screenCellSize < 4) {
    zoomStatus.textContent =
      "Zoom in to see the individual square pixels";
    return;
  }

  const firstCol = Math.max(
    0,
    Math.floor(minX / CELL_SIZE)
  );

  const lastCol = Math.floor(maxX / CELL_SIZE);

  const estimatedCells =
    (lastRow - firstRow + 1) *
    (lastCol - firstCol + 1);

  if (estimatedCells > 100000) {
    zoomStatus.textContent =
      "Zoom in further to see the pixel grid";
    return;
  }

  ctx.strokeStyle = "rgba(255,255,255,0.48)";
  ctx.lineWidth = 0.6;

  for (let row = firstRow; row <= lastRow; row++) {
    for (let col = firstCol; col <= lastCol; col++) {
      const id = row * GRID_WIDTH + col;

      if (id >= TOTAL_PIXELS) continue;

      const firstWorld = Math.floor(minX / WORLD_SIZE);
      const lastWorld = Math.floor(maxX / WORLD_SIZE);

      for (let world = firstWorld; world <= lastWorld; world++) {
        const rect = pixelScreenBounds(id, world);

        if (
          rect.x + rect.width < 0 ||
          rect.y + rect.height < 0 ||
          rect.x > size.x ||
          rect.y > size.y
        ) {
          continue;
        }

        ctx.strokeRect(
          rect.x,
          rect.y,
          rect.width,
          rect.height
        );
      }
    }
  }

  zoomStatus.textContent =
    "10 million square pixels · " +
    screenCellSize.toFixed(1) + " px per cell";
}

/* =====================================
   COUNTRY SELECTOR
===================================== */

const countrySelect = document.getElementById("countrySelect");

Object.keys(flags).forEach(code => {
  const option = document.createElement("option");

  option.value = code;
  option.textContent = flags[code].name;

  countrySelect.appendChild(option);
});

countrySelect.value = selectedCountry;

function updateFlagPreview() {
  const preview = document.getElementById("flagPreview");
  const previewCtx = preview.getContext("2d");

  previewCtx.clearRect(0, 0, preview.width, preview.height);

  drawFlag(
    previewCtx,
    0,
    0,
    preview.width,
    preview.height,
    flags[selectedCountry]
  );
}

countrySelect.addEventListener("change", () => {
  selectedCountry = countrySelect.value;
  updateFlagPreview();
});

updateFlagPreview();

/* =====================================
   SELECT PIXEL
===================================== */

map.on("click", function(event) {
  const id = coordinatesToPixel(event.latlng);

  if (id === null) return;

  if (selectedPixels.has(id)) {
    selectedPixels.delete(id);
  } else {
    selectedPixels.set(id, selectedCountry);
  }

  updateStats();
  requestDraw();

  L.popup()
    .setLatLng(event.latlng)
    .setContent(
      "<b>OUR GLOBE</b><br>" +
      "Pixel ID: " + id +
      "<br>Flag: " + flags[selectedCountry].name +
      "<br>Price: €0.10"
    )
    .openOn(map);
});

/* =====================================
   STATISTICS
===================================== */

function updateStats() {
  const count = selectedPixels.size;

  document.getElementById("selected").textContent =
    count.toLocaleString("en-US");

  document.getElementById("price").textContent =
    "€" + (count * PIXEL_PRICE).toFixed(2);
}

function clearSelection() {
  selectedPixels.clear();
  updateStats();
  requestDraw();
}

function showBuyMessage() {
  alert(
    "OUR GLOBE is currently a demonstration. " +
    "Online payments and permanent pixel ownership " +
    "will be added in a future version."
  );
}

/* =====================================
   MAP EVENTS
===================================== */

map.on("move zoom moveend zoomend", requestDraw);

map.on("resize", resizeCanvas);

window.addEventListener("resize", resizeCanvas);

setTimeout(resizeCanvas, 200);

updateStats();

</script>
</body>
</html>
