
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR GLOBE — Own Your Pixel</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(
    to bottom,
    rgba(5, 10, 15, .96),
    rgba(5, 10, 15, .65),
    transparent
  );
  pointer-events: none;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 3px;
}

.logo span {
  color: #69b88b;
}

.header-text {
  font-size: 11px;
  color: #a9b8c4;
  letter-spacing: 2px;
}

#map {
  width: 100vw;
  height: 100vh;
  background: #132b3c;
}

.panel {
  position: absolute;
  z-index: 1000;
  left: 18px;
  bottom: 20px;
  width: 270px;
  padding: 17px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 13px;
  background: rgba(7, 14, 21, .93);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.panel-title {
  font-size: 12px;
  letter-spacing: 2px;
  color: #9aabb9;
  margin-bottom: 13px;
}

.stat {
  display: flex;
  justify-content: space-between;
  margin: 9px 0;
  font-size: 13px;
}

.stat strong {
  color: #79d5a0;
}

.total {
  border-top: 1px solid #293743;
  margin-top: 13px;
  padding-top: 13px;
  font-size: 15px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 7px;
  padding: 12px;
  margin-top: 12px;
  font-weight: bold;
  cursor: pointer;
}

.clear {
  background: #263642;
  color: white;
}

.buy {
  background: #75c997;
  color: #07130c;
}

.hint {
  font-size: 11px;
  color: #9aaab6;
  line-height: 1.5;
  margin-top: 12px;
}

.leaflet-control-attribution {
  font-size: 9px !important;
}

@media(max-width: 600px) {
  header {
    padding: 13px;
  }

  .logo {
    font-size: 17px;
  }

  .header-text {
    font-size: 8px;
  }

  .panel {
    left: 10px;
    bottom: 12px;
    width: 235px;
    padding: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OUR <span>GLOBE</span></div>
  <div class="header-text">ONE GLOBE. MILLIONS OF OWNERS.</div>
</header>

<div id="map"></div>

<div class="panel">
  <div class="panel-title">YOUR PIXELS</div>

  <div class="stat">
    <span>Total pixels</span>
    <strong>10,000,000</strong>
  </div>

  <div class="stat">
    <span>Price per pixel</span>
    <strong>€0.10</strong>
  </div>

  <div class="stat">
    <span>Selected</span>
    <strong id="selected">0</strong>
  </div>

  <div class="stat total">
    <span>Total price</span>
    <strong id="price">€0.00</strong>
  </div>

  <button class="clear" onclick="clearSelection()">
    CLEAR SELECTION
  </button>

  <button class="buy" onclick="showBuyMessage()">
    BUY PIXELS
  </button>

  <div class="hint">
    Zoom in to explore the world. Tap the map to select a pixel.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const GRID_WIDTH = 4000;
const GRID_HEIGHT = 2500;
const TOTAL_PIXELS = 10000000;
const PIXEL_PRICE = 0.10;

const selectedPixels = new Set();
const pixelMarkers = new Map();

const map = L.map("map", {
  center: [25, 10],
  zoom: 2,
  minZoom: 2,
  maxZoom: 17,
  worldCopyJump: true
});

// Natural terrain map: mountains, rivers, lakes, forests and borders.
L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Map style: <a href="https://opentopomap.org">OpenTopoMap</a>',
    subdomains: "abc"
  }
).addTo(map);

// Convert geographic coordinates to a unique logical pixel ID.
function coordinatesToPixel(lat, lng) {
  const safeLat = Math.max(-90, Math.min(90, lat));
  const safeLng = Math.max(-180, Math.min(180, lng));

  const col = Math.min(
    GRID_WIDTH - 1,
    Math.max(0, Math.floor((safeLng + 180) / 360 * GRID_WIDTH))
  );

  const row = Math.min(
    GRID_HEIGHT - 1,
    Math.max(0, Math.floor((90 - safeLat) / 180 * GRID_HEIGHT))
  );

  return row * GRID_WIDTH + col;
}

// Add or remove a selected pixel.
map.on("click", function(event) {
  const id = coordinatesToPixel(
    event.latlng.lat,
    event.latlng.lng
  );

  if (selectedPixels.has(id)) {
    selectedPixels.delete(id);

    if (pixelMarkers.has(id)) {
      map.removeLayer(pixelMarkers.get(id));
      pixelMarkers.delete(id);
    }
  } else {
    selectedPixels.add(id);

    const marker = L.circleMarker(event.latlng, {
      radius: 6,
      color: "#ffe08a",
      weight: 2,
      fillColor: "#f5bd42",
      fillOpacity: 0.9
    }).addTo(map);

    marker.bindPopup(
      "OUR GLOBE PIXEL #" + id
    );

    pixelMarkers.set(id, marker);
  }

  updateStats();
});

function updateStats() {
  const count = selectedPixels.size;
  const total = (count * PIXEL_PRICE).toFixed(2);

  document.getElementById("selected").textContent =
    count.toLocaleString("en-US");

  document.getElementById("price").textContent =
    "€" + total;
}

function clearSelection() {
  selectedPixels.clear();

  pixelMarkers.forEach(marker => {
    map.removeLayer(marker);
  });

  pixelMarkers.clear();
  updateStats();
}

function showBuyMessage() {
  alert(
    "OUR GLOBE is currently a demonstration. " +
    "Online payments and permanent pixel ownership " +
    "will be added in a future version."
  );
}

updateStats();
</script>

</body>
</html>
