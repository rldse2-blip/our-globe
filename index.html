
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR GLOBE — Own Your Pixel</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, rgba(5,10,15,.96), transparent);
  pointer-events: none;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 3px;
}

.logo span { color: #69b88b; }

.header-text {
  font-size: 11px;
  color: #a9b8c4;
  letter-spacing: 2px;
}

#map {
  width: 100vw;
  height: 100vh;
  background: #132b3c;
}

/* Pixel overlay */
#pixelCanvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 500;
  pointer-events: none;
}

.panel {
  position: absolute;
  z-index: 1000;
  left: 18px;
  bottom: 20px;
  width: 270px;
  padding: 17px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 13px;
  background: rgba(7,14,21,.94);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.panel-title {
  font-size: 12px;
  letter-spacing: 2px;
  color: #9aabb9;
  margin-bottom: 13px;
}

.stat {
  display: flex;
  justify-content: space-between;
  margin: 9px 0;
  font-size: 13px;
}

.stat strong { color: #79d5a0; }

.total {
  border-top: 1px solid #293743;
  margin-top: 13px;
  padding-top: 13px;
  font-size: 15px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 7px;
  padding: 12px;
  margin-top: 12px;
  font-weight: bold;
  cursor: pointer;
}

.clear {
  background: #263642;
  color: white;
}

.buy {
  background: #75c997;
  color: #07130c;
}

.hint {
  font-size: 11px;
  color: #9aaab6;
  line-height: 1.5;
  margin-top: 12px;
}

#zoomStatus {
  color: #79d5a0;
  margin-top: 8px;
  font-size: 11px;
}

@media(max-width:600px) {
  header { padding: 13px; }
  .logo { font-size: 17px; }
  .header-text { font-size: 8px; }
  .panel {
    left: 10px;
    bottom: 12px;
    width: 235px;
    padding: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OUR <span>GLOBE</span></div>
  <div class="header-text">ONE GLOBE. MILLIONS OF OWNERS.</div>
</header>

<div id="map"></div>
<canvas id="pixelCanvas"></canvas>

<div class="panel">
  <div class="panel-title">YOUR PIXELS</div>

  <div class="stat">
    <span>Total pixels</span>
    <strong>10,000,000</strong>
  </div>

  <div class="stat">
    <span>Pixel grid</span>
    <strong>4000 × 2500</strong>
  </div>

  <div class="stat">
    <span>Price per pixel</span>
    <strong>€0.10</strong>
  </div>

  <div class="stat">
    <span>Selected</span>
    <strong id="selected">0</strong>
  </div>

  <div class="stat total">
    <span>Total price</span>
    <strong id="price">€0.00</strong>
  </div>

  <button class="clear" onclick="clearSelection()">
    CLEAR SELECTION
  </button>

  <button class="buy" onclick="showBuyMessage()">
    BUY PIXELS
  </button>

  <div class="hint">
    Zoom in to see individual pixels. Tap a pixel to select it.
  </div>

  <div id="zoomStatus">Pixel grid: zoom in to explore</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const GRID_WIDTH = 4000;
const GRID_HEIGHT = 2500;
const TOTAL_PIXELS = GRID_WIDTH * GRID_HEIGHT;
const PIXEL_PRICE = 0.10;

const selectedPixels = new Set();

const map = L.map("map", {
  center: [25, 10],
  zoom: 2,
  minZoom: 2,
  maxZoom: 17,
  worldCopyJump: true
});

L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Map style: <a href="https://opentopomap.org">OpenTopoMap</a>',
    subdomains: "abc"
  }
).addTo(map);

// Canvas for visible pixel cells
const canvas = document.getElementById("pixelCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const size = map.getSize();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(size.x * dpr);
  canvas.height = Math.round(size.y * dpr);

  canvas.style.width = size.x + "px";
  canvas.style.height = size.y + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPixels();
}

// Convert geographic coordinates into a unique pixel ID
function coordinatesToPixel(lat, lng) {
  const safeLat = Math.max(-90, Math.min(90, lat));
  const safeLng = Math.max(-180, Math.min(180, lng));

  const col = Math.min(
    GRID_WIDTH - 1,
    Math.max(0, Math.floor(
      (safeLng + 180) / 360 * GRID_WIDTH
    ))
  );

  const row = Math.min(
    GRID_HEIGHT - 1,
    Math.max(0, Math.floor(
      (90 - safeLat) / 180 * GRID_HEIGHT
    ))
  );

  return row * GRID_WIDTH + col;
}

// Get geographic boundaries of a pixel
function pixelBounds(id) {
  const row = Math.floor(id / GRID_WIDTH);
  const col = id % GRID_WIDTH;

  const north = 90 - row * 180 / GRID_HEIGHT;
  const south = 90 - (row + 1) * 180 / GRID_HEIGHT;

  const west = -180 + col * 360 / GRID_WIDTH;
  const east = -180 + (col + 1) * 360 / GRID_WIDTH;

  return { north, south, west, east };
}

// Draw only cells currently visible on the screen
function drawPixels() {
  const size = map.getSize();

  ctx.clearRect(0, 0, size.x, size.y);

  const bounds = map.getBounds();

  const north = Math.min(85, bounds.getNorth());
  const south = Math.max(-85, bounds.getSouth());

  const west = Math.max(-180, bounds.getWest());
  const east = Math.min(180, bounds.getEast());

  if (west >= east || south >= north) {
    document.getElementById("zoomStatus").textContent =
      "Move the map to explore pixels";
    return;
  }

  const firstCol = Math.max(
    0,
    Math.floor((west + 180) / 360 * GRID_WIDTH)
  );

  const lastCol = Math.min(
    GRID_WIDTH - 1,
    Math.floor((east + 180) / 360 * GRID_WIDTH)
  );

  const firstRow = Math.max(
    0,
    Math.floor((90 - north) / 180 * GRID_HEIGHT)
  );

  const lastRow = Math.min(
    GRID_HEIGHT - 1,
    Math.floor((90 - south) / 180 * GRID_HEIGHT)
  );

  const columns = lastCol - firstCol + 1;
  const rows = lastRow - firstRow + 1;

  const estimatedCells = columns * rows;

  // Avoid drawing an excessive number of tiny cells.
  if (estimatedCells > 120000) {
    document.getElementById("zoomStatus").textContent =
      "Zoom in to reveal individual pixels";
    return;
  }

  let visibleCells = 0;

  for (let row = firstRow; row <= lastRow; row++) {
    const cellNorth = 90 - row * 180 / GRID_HEIGHT;
    const cellSouth = 90 - (row + 1) * 180 / GRID_HEIGHT;

    for (let col = firstCol; col <= lastCol; col++) {
      const id = row * GRID_WIDTH + col;

      const cellWest = -180 + col * 360 / GRID_WIDTH;
      const cellEast = -180 + (col + 1) * 360 / GRID_WIDTH;

      const topLeft = map.latLngToContainerPoint([
        cellNorth,
        cellWest
      ]);

      const bottomRight = map.latLngToContainerPoint([
        cellSouth,
        cellEast
      ]);

      const width = bottomRight.x - topLeft.x;
      const height = bottomRight.y - topLeft.y;

      // Show individual cells once they are large enough.
      if (width < 2 || height < 2) continue;

      visibleCells++;

      if (selectedPixels.has(id)) {
        ctx.fillStyle = "rgba(255,190,65,0.85)";
        ctx.fillRect(
          topLeft.x,
          topLeft.y,
          width,
          height
        );

        ctx.strokeStyle = "#fff0b0";
        ctx.lineWidth = 1;
        ctx.strokeRect(
          topLeft.x,
          topLeft.y,
          width,
          height
        );
      } else {
        ctx.fillStyle = "rgba(255,255,255,0.035)";
        ctx.fillRect(
          topLeft.x,
          topLeft.y,
          width,
          height
        );

        ctx.strokeStyle = "rgba(255,255,255,0.32)";
        ctx.lineWidth = 0.7;
        ctx.strokeRect(
          topLeft.x,
          topLeft.y,
          width,
          height
        );
      }
    }
  }

  document.getElementById("zoomStatus").textContent =
    visibleCells.toLocaleString("en-US") +
    " visible pixel cells";
}

// Select or deselect a pixel
map.on("click", function(event) {
  const id = coordinatesToPixel(
    event.latlng.lat,
    event.latlng.lng
  );

  if (selectedPixels.has(id)) {
    selectedPixels.delete(id);
  } else {
    selectedPixels.add(id);
  }

  updateStats();
  drawPixels();

  L.popup()
    .setLatLng(event.latlng)
    .setContent(
      "<b>OUR GLOBE</b><br>Pixel ID: " + id +
      "<br>Price: €0.10"
    )
    .openOn(map);
});

function updateStats() {
  const count = selectedPixels.size;

  document.getElementById("selected").textContent =
    count.toLocaleString("en-US");

  document.getElementById("price").textContent =
    "€" + (count * PIXEL_PRICE).toFixed(2);
}

function clearSelection() {
  selectedPixels.clear();
  updateStats();
  drawPixels();
}

function showBuyMessage() {
  alert(
    "OUR GLOBE is currently a demonstration. " +
    "Online payments and permanent pixel ownership " +
    "will be added in a future version."
  );
}

// Redraw after map movement, zooming and resizing
map.on("move zoom moveend zoomend", drawPixels);
map.on("resize", resizeCanvas);
window.addEventListener("resize", resizeCanvas);

setTimeout(resizeCanvas, 100);

updateStats();
</script>

</body>
</html>
