
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR GLOBE — Own Your Pixel</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080d12;
  color:white;
  font-family:Arial,sans-serif;
}

#map{
  position:absolute;
  inset:0;
  background:#132b3c;
}

#pixelCanvas{
  position:absolute;
  inset:0;
  z-index:500;
  pointer-events:none;
}

header{
  position:absolute;
  z-index:1000;
  top:0;
  left:0;
  width:100%;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(to bottom,rgba(5,10,15,.96),transparent);
  pointer-events:none;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:3px;
}

.logo span{color:#69b88b}

.header-text{
  font-size:11px;
  color:#a9b8c4;
  letter-spacing:2px;
}

.panel{
  position:absolute;
  z-index:1000;
  left:18px;
  bottom:20px;
  width:260px;
  padding:17px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  background:rgba(7,14,21,.95);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.panel-title{
  font-size:12px;
  letter-spacing:2px;
  color:#9aabb9;
  margin-bottom:14px;
}

.stat{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  font-size:13px;
}

.stat strong{color:#79d5a0}

#zoomStatus{
  color:#79d5a0;
  margin-top:13px;
  font-size:11px;
  line-height:1.5;
}

.hint{
  font-size:11px;
  color:#9aaab6;
  line-height:1.5;
  margin-top:10px;
}

@media(max-width:600px){
  header{padding:13px}
  .logo{font-size:17px}
  .header-text{font-size:8px;letter-spacing:1px}
  .panel{
    left:10px;
    bottom:12px;
    width:235px;
    padding:13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OUR <span>GLOBE</span></div>
  <div class="header-text">ONE GLOBE. MILLIONS OF OWNERS.</div>
</header>

<div id="map"></div>
<canvas id="pixelCanvas"></canvas>

<div class="panel">
  <div class="panel-title">OUR PIXEL WORLD</div>

  <div class="stat">
    <span>Total pixels</span>
    <strong>10,000,000</strong>
  </div>

  <div class="stat">
    <span>Grid</span>
    <strong>3162 × 3163*</strong>
  </div>

  <div class="stat">
    <span>Pixel price</span>
    <strong>€0.10</strong>
  </div>

  <div id="zoomStatus">
    Zoom in to reveal the individual pixels.
  </div>

  <div class="hint">
    Move around the world and zoom in to see the individual square pixels.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =================================
   PIXEL GRID
================================= */

const GRID_WIDTH = 3162;
const GRID_HEIGHT = 3163;
const TOTAL_PIXELS = 10000000;
const LAST_ROW_PIXELS = 1756;

/*
  A teljes 10 millió pixelt négyzet alakú
  cellákkal helyezzük el.

  A rács nagyon kicsivel keskenyebb a
  térképnél, így minden pixel négyzet marad.
*/

const CELL = 256 / GRID_HEIGHT;

const GRID_PIXEL_WIDTH = GRID_WIDTH * CELL;
const X_OFFSET = (256 - GRID_PIXEL_WIDTH) / 2;

const MIN_SCREEN_CELL = 2.2;
const MAX_VISIBLE_PIXELS = 120000;


/* =================================
   MAP
================================= */

const map = L.map("map", {
  center: [25, 10],
  zoom: 2,
  minZoom: 2,
  maxZoom: 17,
  worldCopyJump: false
});

L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    subdomains: "abc",
    attribution: "© OpenStreetMap contributors | © OpenTopoMap"
  }
).addTo(map);


/* =================================
   CANVAS
================================= */

const canvas = document.getElementById("pixelCanvas");
const ctx = canvas.getContext("2d");

let framePending = false;

function resizeCanvas(){

  const size = map.getSize();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(size.x * dpr);
  canvas.height = Math.round(size.y * dpr);

  canvas.style.width = size.x + "px";
  canvas.style.height = size.y + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawPixels();
}


function requestDraw(){

  if(framePending) return;

  framePending = true;

  requestAnimationFrame(() => {

    framePending = false;

    drawPixels();

  });
}


/* =================================
   PIXEL DRAWING
================================= */

function drawPixels(){

  const size = map.getSize();

  ctx.clearRect(0, 0, size.x, size.y);

  const zoom = map.getZoom();
  const scale = Math.pow(2, zoom);

  const screenCell = CELL * scale;

  const status = document.getElementById("zoomStatus");

  /*
    A pixelek csak akkor jelennek meg,
    amikor már elég nagyok ahhoz,
    hogy különálló négyzetként látszódjanak.
  */

  if(screenCell < MIN_SCREEN_CELL){

    status.textContent =
      "Zoom in to reveal the individual square pixels.";

    return;
  }


  const bounds = map.getPixelBounds(0);

  const minX = bounds.min.x;
  const maxX = bounds.max.x;

  const minY = Math.max(0, bounds.min.y);
  const maxY = Math.min(256, bounds.max.y);

  if(maxY <= minY) return;


  const firstRow = Math.max(
    0,
    Math.floor(minY / CELL)
  );

  const lastRow = Math.min(
    GRID_HEIGHT - 1,
    Math.floor(maxY / CELL)
  );


  const firstWorld = Math.floor(minX / 256);
  const lastWorld = Math.floor(maxX / 256);

  const origin = map.getPixelOrigin();

  let totalEstimate = 0;


  /*
    Előzetes becslés:
    nem rajzolunk túl sok pixelt egyszerre,
    így mobilon is gyors marad.
  */

  for(let world = firstWorld; world <= lastWorld; world++){

    const worldOffset = world * 256;

    const gridStart = worldOffset + X_OFFSET;

    const firstCol = Math.max(
      0,
      Math.floor((minX - gridStart) / CELL)
    );

    const lastCol = Math.min(
      GRID_WIDTH - 1,
      Math.floor((maxX - gridStart) / CELL)
    );

    if(lastCol >= firstCol){

      totalEstimate +=
        (lastRow - firstRow + 1) *
        (lastCol - firstCol + 1);

    }
  }


  if(totalEstimate > MAX_VISIBLE_PIXELS){

    status.textContent =
      "Zoom in a little more to see the pixels clearly.";

    return;
  }


  /*
    PIXEL MEGJELENÍTÉS
  */

  let visible = 0;

  /*
    A vonalvastagság a nagyításhoz igazodik.
    Így a pixelek jól elkülönülnek,
    de nem takarják el egymást.
  */

  const lineWidth = Math.min(
    1.6,
    Math.max(0.85, screenCell * 0.16)
  );

  ctx.lineWidth = lineWidth;

  ctx.strokeStyle = "rgba(5, 12, 19, 0.88)";

  ctx.lineJoin = "miter";


  for(let world = firstWorld; world <= lastWorld; world++){

    const worldOffset = world * 256;

    const gridStart = worldOffset + X_OFFSET;

    const firstCol = Math.max(
      0,
      Math.floor((minX - gridStart) / CELL)
    );

    const lastCol = Math.min(
      GRID_WIDTH - 1,
      Math.floor((maxX - gridStart) / CELL)
    );

    if(firstCol > lastCol) continue;


    for(let row = firstRow; row <= lastRow; row++){

      const y = row * CELL;

      const sy = y * scale - origin.y;

      if(sy > size.y || sy + screenCell < 0) continue;


      for(let col = firstCol; col <= lastCol; col++){

        /*
          Az utolsó sorban csak 1756 pixel van.
        */

        if(
          row === GRID_HEIGHT - 1 &&
          col >= LAST_ROW_PIXELS
        ){
          continue;
        }

        const x = gridStart + col * CELL;

        const sx = x * scale - origin.x;

        if(
          sx > size.x ||
          sx + screenCell < 0
        ){
          continue;
        }

        /*
          Enyhén áttetsző kitöltés:
          a térkép továbbra is látható marad.
        */

        ctx.fillStyle = "rgba(4, 12, 20, 0.025)";

        ctx.fillRect(
          sx,
          sy,
          screenCell,
          screenCell
        );

        /*
          Sötét, jól látható elválasztóvonal.
        */

        ctx.strokeRect(
          sx,
          sy,
          screenCell,
          screenCell
        );

        visible++;

      }
    }
  }


  status.textContent =
    visible.toLocaleString("en-US") +
    " visible square pixels";

}


/* =================================
   EVENTS
================================= */

map.on("moveend zoomend", requestDraw);

map.on("resize", resizeCanvas);

window.addEventListener("resize", resizeCanvas);


/* =================================
   START
================================= */

setTimeout(() => {

  map.invalidateSize();

  resizeCanvas();

}, 300);

</script>

</body>
</html>
