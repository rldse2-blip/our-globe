
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR GLOBE</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080d12;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #101820;
    }

    #pixelCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 450;
      pointer-events: none;
    }

    .header {
      position: absolute;
      z-index: 600;
      top: 18px;
      left: 18px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(5,12,20,.78);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .slogan {
      margin-top: 5px;
      color: #9eabb7;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .panel {
      position: absolute;
      z-index: 600;
      left: 14px;
      bottom: 22px;
      width: 210px;
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 13px;
      background: rgba(5,12,20,.68);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      box-shadow: 0 5px 25px rgba(0,0,0,.18);
    }

    .panel-title {
      margin-bottom: 11px;
      color: #aab7c3;
      font-size: 10px;
      letter-spacing: 1.8px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 0;
      font-size: 12px;
      color: #c2ccd5;
    }

    .stat strong {
      color: white;
      font-weight: 600;
    }

    .selected {
      color: #8fe0a8 !important;
    }

    .price {
      color: #8fe0a8 !important;
      font-size: 16px;
    }

    .hint {
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: #8795a2;
      font-size: 10px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .header {
        top: 12px;
        left: 12px;
      }

      .panel {
        left: 10px;
        bottom: 16px;
        width: 195px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>
  <canvas id="pixelCanvas"></canvas>

  <div class="header">
    <div class="logo">OUR GLOBE</div>
    <div class="slogan">ONE GLOBE. MILLIONS OF OWNERS.</div>
  </div>

  <div class="panel">
    <div class="panel-title">YOUR PIXELS</div>

    <div class="stat">
      <span>Total pixels</span>
      <strong>10,000,000</strong>
    </div>

    <div class="stat">
      <span>Price / pixel</span>
      <strong>0.10 €</strong>
    </div>

    <div class="stat">
      <span>Selected</span>
      <strong class="selected" id="selectedCount">0</strong>
    </div>

    <div class="stat">
      <span>Total price</span>
      <strong class="price" id="totalPrice">0,00 €</strong>
    </div>

    <div class="hint" id="hint">
      Nagyíts rá a térképre, majd koppints egy pixelre a kijelöléshez.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // MAP
    const map = L.map("map", {
      center: [25, 10],
      zoom: 2,
      minZoom: 2,
      maxZoom: 17,
      worldCopyJump: false
    });

    L.tileLayer(
      "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
      {
        attribution: '&copy; OpenStreetMap contributors, OpenTopoMap',
        maxZoom: 17,
        noWrap: true
      }
    ).addTo(map);


    // PIXEL SYSTEM
    const TOTAL_PIXELS = 10000000;

    const GRID_WIDTH = 3162;
    const GRID_HEIGHT = 3163;

    const LAST_ROW_PIXELS = 1756;

    const CELL = 256 / GRID_HEIGHT;
    const X_OFFSET = (256 - GRID_WIDTH * CELL) / 2;

    const PRICE_PER_PIXEL = 0.10;

    const canvas = document.getElementById("pixelCanvas");
    const ctx = canvas.getContext("2d");

    const selectedPixels = new Map();

    let drawRequested = false;


    // CANVAS SIZE
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;

      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      requestDraw();
    }


    // UPDATE PANEL
    function updatePanel() {
      const count = selectedPixels.size;
      const total = count * PRICE_PER_PIXEL;

      document.getElementById("selectedCount").textContent =
        count.toLocaleString("hu-HU");

      document.getElementById("totalPrice").textContent =
        total.toFixed(2).replace(".", ",") + " €";
    }


    // DRAW PIXELS
    function drawPixels() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      ctx.clearRect(0, 0, width, height);

      const zoom = map.getZoom();
      const scale = map.getZoomScale(zoom, 0);
      const cellSize = CELL * scale;

      const hint = document.getElementById("hint");

      if (cellSize < 2) {
        hint.textContent =
          "Nagyíts tovább a térképen, hogy a pixeleket ki tudd jelölni.";
        return;
      }

      hint.textContent =
        "Koppints egy pixelre a kijelöléshez. Újabb koppintással törölheted.";

      const origin = map.getPixelOrigin();

      const left = origin.x;
      const top = origin.y;
      const right = left + width;
      const bottom = top + height;

      const worldSize = 256 * scale;

      const firstWorld = Math.floor(left / worldSize);
      const lastWorld = Math.floor(right / worldSize);

      const firstRow = Math.max(
        0,
        Math.floor(top / cellSize) - 1
      );

      const lastRow = Math.min(
        GRID_HEIGHT - 1,
        Math.floor(bottom / cellSize) + 1
      );

      const visibleRows = lastRow - firstRow + 1;

      ctx.lineWidth = Math.max(0.5, Math.min(1.2, cellSize * 0.16));
      ctx.strokeStyle = "rgba(5, 15, 22, 0.85)";
      ctx.fillStyle = "rgba(255,255,255,0.035)";

      for (let world = firstWorld; world <= lastWorld; world++) {

        const worldStart = world * worldSize;

        const firstCol = Math.max(
          0,
          Math.floor(
            (left - worldStart - X_OFFSET * scale) / cellSize
          ) - 1
        );

        const lastCol = Math.min(
          GRID_WIDTH - 1,
          Math.floor(
            (right - worldStart - X_OFFSET * scale) / cellSize
          ) + 1
        );

        if (lastCol < firstCol) continue;

        const visibleCols = lastCol - firstCol + 1;

        // Prevent excessive drawing on smaller screens.
        if (visibleRows * visibleCols > 150000) {
          hint.textContent =
            "Nagyíts egy kicsit közelebb a pixelek megjelenítéséhez.";
          continue;
        }

        for (let row = firstRow; row <= lastRow; row++) {

          const maxColForRow =
            row === GRID_HEIGHT - 1
              ? LAST_ROW_PIXELS - 1
              : GRID_WIDTH - 1;

          const rowY = row * cellSize - origin.y;

          for (let col = firstCol; col <= Math.min(lastCol, maxColForRow); col++) {

            const pixelId = row * GRID_WIDTH + col;

            if (pixelId >= TOTAL_PIXELS) continue;

            const x =
              (worldStart + (X_OFFSET + col * CELL) * scale) -
              origin.x;

            const y = rowY;

            if (x > width || x + cellSize < 0) continue;
            if (y > height || y + cellSize < 0) continue;

            if (selectedPixels.has(pixelId)) {
              ctx.fillStyle = "rgba(91, 210, 132, 0.38)";
              ctx.fillRect(x, y, cellSize, cellSize);

              ctx.strokeStyle = "#8fffb0";
              ctx.lineWidth = Math.max(1.5, Math.min(3, cellSize * 0.12));
              ctx.strokeRect(x, y, cellSize, cellSize);

              ctx.lineWidth = Math.max(0.5, Math.min(1.2, cellSize * 0.16));
              ctx.strokeStyle = "rgba(5, 15, 22, 0.85)";
            } else {
              ctx.fillStyle = "rgba(255,255,255,0.035)";
              ctx.fillRect(x, y, cellSize, cellSize);
              ctx.strokeRect(x, y, cellSize, cellSize);
            }
          }
        }
      }
    }


    // REDRAW WHEN MAP MOVES OR ZOOMS
    function requestDraw() {
      if (drawRequested) return;

      drawRequested = true;

      requestAnimationFrame(() => {
        drawRequested = false;
        drawPixels();
      });
    }


    // SELECT PIXEL
    map.on("click", function(event) {

      const zoom = map.getZoom();
      const scale = map.getZoomScale(zoom, 0);
      const cellSize = CELL * scale;

      if (cellSize < 2) {
        return;
      }

      // Use the same projected grid geometry as the drawing.
      const point = map.project(event.latlng, 0);

      const world = Math.floor(point.x / 256);
      const localX = point.x - world * 256;

      const col = Math.floor(
        (localX - X_OFFSET) / CELL
      );

      const row = Math.floor(point.y / CELL);

      if (row < 0 || row >= GRID_HEIGHT) return;
      if (col < 0 || col >= GRID_WIDTH) return;

      if (row === GRID_HEIGHT - 1 && col >= LAST_ROW_PIXELS) {
        return;
      }

      const pixelId = row * GRID_WIDTH + col;

      if (pixelId < 0 || pixelId >= TOTAL_PIXELS) return;

      // Toggle selection.
      if (selectedPixels.has(pixelId)) {
        selectedPixels.delete(pixelId);
      } else {
        selectedPixels.set(pixelId, true);
      }

      updatePanel();
      requestDraw();
    });


    // MAP EVENTS
    map.on("move zoom moveend zoomend", requestDraw);

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    updatePanel();

  </script>

</body>
</html>
