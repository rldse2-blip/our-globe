
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR GLOBE – Own Your Pixel</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#080d14;color:white}
#app{height:100%;display:flex;flex-direction:column}
header{padding:14px 16px;background:#080d14;z-index:1000;border-bottom:1px solid #263342}
.logo{font-size:22px;font-weight:800;letter-spacing:3px}
.subtitle{font-size:11px;color:#9aaabd;margin-top:5px;letter-spacing:1px}
#toolbar{padding:12px 14px;background:#101a26;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:1000}
select,button{background:#1b2a3b;color:white;border:1px solid #40536a;border-radius:7px;padding:10px;font-size:14px}
button{cursor:pointer}
#flagPreview{width:66px;height:44px;border:1px solid #64748b;border-radius:4px;background:white}
.info{font-size:12px;color:#c4d0dc}
#map{flex:1;min-height:0;position:relative;background:#182a37}
#pixelCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:450;pointer-events:none}
#message{position:absolute;z-index:700;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(5,12,20,.9);padding:10px 15px;border:1px solid #526477;border-radius:8px;font-size:12px;text-align:center;max-width:90%;pointer-events:none}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>

<body>
<div id="app">
<header>
  <div class="logo">OUR GLOBE</div>
  <div class="subtitle">ONE GLOBE. MILLIONS OF OWNERS.</div>
</header>

<div id="toolbar">
  <div>
    <div class="info">Válassz országot:</div>
    <select id="country">
      <option value="RO">Románia 🇷🇴</option>
      <option value="HU">Magyarország 🇭🇺</option>
      <option value="FR">Franciaország 🇫🇷</option>
      <option value="DE">Németország 🇩🇪</option>
      <option value="IT">Olaszország 🇮🇹</option>
      <option value="ES">Spanyolország 🇪🇸</option>
      <option value="NL">Hollandia 🇳🇱</option>
      <option value="UA">Ukrajna 🇺🇦</option>
      <option value="PL">Lengyelország 🇵🇱</option>
      <option value="JP">Japán 🇯🇵</option>
      <option value="AT">Ausztria 🇦🇹</option>
      <option value="BG">Bulgária 🇧🇬</option>
      <option value="RU">Oroszország 🇷🇺</option>
      <option value="IE">Írország 🇮🇪</option>
      <option value="BE">Belgium 🇧🇪</option>
      <option value="CZ">Csehország 🇨🇿</option>
      <option value="SE">Svédország 🇸🇪</option>
      <option value="CH">Svájc 🇨🇭</option>
    </select>
  </div>

  <canvas id="flagPreview" width="132" height="88"></canvas>

  <div class="info">
    Kiválasztott pixelek: <strong id="count">0</strong><br>
    Ár: 0,10 € / pixel
  </div>

  <button id="clearButton">Összes törlése</button>
</div>

<div id="map">
  <canvas id="pixelCanvas"></canvas>
  <div id="message">Nagyíts a térképre, majd koppints egy kockára!</div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* OUR GLOBE – 10 MILLION PIXELS */

const GRID_WIDTH = 3162;
const GRID_HEIGHT = 3163;
const TOTAL_PIXELS = 10000000;

/* A négyzetes cellák a teljes térképmagasságot fedik le.
   Az utolsó sorban csak 1756 pixel található. */
const CELL_SIZE = 256 / GRID_HEIGHT;
const GRID_PIXEL_COUNT = GRID_WIDTH * (GRID_HEIGHT - 1);
const LAST_ROW_COUNT = TOTAL_PIXELS - GRID_PIXEL_COUNT;
const GRID_START_X = (256 - GRID_WIDTH * CELL_SIZE) / 2;

const selectedPixels = new Map();

const flags = {
  RO:{type:"vertical",colors:["#002B7F","#FCD116","#CE1126"]},
  HU:{type:"horizontal",colors:["#CE2939","#FFFFFF","#477050"]},
  FR:{type:"vertical",colors:["#0055A4","#FFFFFF","#EF4135"]},
  DE:{type:"horizontal",colors:["#000000","#DD0000","#FFCE00"]},
  IT:{type:"vertical",colors:["#009246","#FFFFFF","#CE2B37"]},
  ES:{type:"spain",colors:["#AA151B","#F1BF00","#AA151B"]},
  NL:{type:"horizontal",colors:["#AE1C28","#FFFFFF","#21468B"]},
  UA:{type:"horizontal",colors:["#0057B7","#FFD700"]},
  PL:{type:"horizontal",colors:["#FFFFFF","#DC143C"]},
  JP:{type:"japan",colors:["#FFFFFF","#BC002D"]},
  AT:{type:"horizontal",colors:["#ED2939","#FFFFFF","#ED2939"]},
  BG:{type:"horizontal",colors:["#FFFFFF","#00966E","#D62612"]},
  RU:{type:"horizontal",colors:["#FFFFFF","#0039A6","#D52B1E"]},
  IE:{type:"vertical",colors:["#169B62","#FFFFFF","#FF883E"]},
  BE:{type:"vertical",colors:["#000000","#FAE042","#ED2939"]},
  CZ:{type:"czech",colors:["#FFFFFF","#D7141A"]},
  SE:{type:"sweden",colors:["#006AA7","#FECC00"]},
  CH:{type:"swiss",colors:["#D52B1E","#FFFFFF"]}
};

const map = L.map("map", {
  zoomControl:true,
  zoomSnap:0.5,
  minZoom:2,
  maxZoom:18,
  worldCopyJump:false
}).setView([25,10],2);

L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{
  maxZoom:17,
  attribution:'© OpenStreetMap contributors, © OpenTopoMap'
}).addTo(map);

const canvas = document.getElementById("pixelCanvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

let drawPending = false;

function drawFlag(context,x,y,w,h,code){
  const flag = flags[code];
  if(!flag)return;

  context.save();
  context.beginPath();
  context.rect(x,y,w,h);
  context.clip();

  if(flag.type==="vertical"){
    flag.colors.forEach((color,i)=>{
      context.fillStyle=color;
      context.fillRect(x+i*w/3,y,w/3+0.5,h);
    });
  }
  else if(flag.type==="horizontal"){
    flag.colors.forEach((color,i)=>{
      context.fillStyle=color;
      context.fillRect(x,y+i*h/flag.colors.length,w,h/flag.colors.length+0.5);
    });
  }
  else if(flag.type==="spain"){
    context.fillStyle=flag.colors[0];
    context.fillRect(x,y,w,h/4);
    context.fillStyle=flag.colors[1];
    context.fillRect(x,y+h/4,w,h/2);
    context.fillStyle=flag.colors[2];
    context.fillRect(x,y+3*h/4,w,h/4);
  }
  else if(flag.type==="japan"){
    context.fillStyle="#FFFFFF";
    context.fillRect(x,y,w,h);
    context.fillStyle="#BC002D";
    context.beginPath();
    context.arc(x+w/2,y+h/2,Math.min(w,h)*0.25,0,Math.PI*2);
    context.fill();
  }
  else if(flag.type==="czech"){
    context.fillStyle="#FFFFFF";
    context.fillRect(x,y,w,h/2);
    context.fillStyle="#D7141A";
    context.fillRect(x,y+h/2,w,h/2);
    context.fillStyle="#11457E";
    context.beginPath();
    context.moveTo(x,y);
    context.lineTo(x+w*0.48,y+h/2);
    context.lineTo(x,y+h);
    context.closePath();
    context.fill();
  }
  else if(flag.type==="sweden"){
    context.fillStyle="#006AA7";
    context.fillRect(x,y,w,h);
    context.fillStyle="#FECC00";
    context.fillRect(x+w*0.30,y,w*0.12,h);
    context.fillRect(x,y+h*0.42,w,h*0.16);
  }
  else if(flag.type==="swiss"){
    context.fillStyle="#D52B1E";
    context.fillRect(x,y,w,h);
    context.fillStyle="#FFFFFF";
    context.fillRect(x+w*0.42,y+h*0.20,w*0.16,h*0.60);
    context.fillRect(x+w*0.20,y+h*0.42,w*0.60,h*0.16);
  }

  context.restore();
}

function updatePreview(){
  const preview=document.getElementById("flagPreview");
  const pctx=preview.getContext("2d");
  pctx.clearRect(0,0,preview.width,preview.height);
  drawFlag(pctx,0,0,preview.width,preview.height,document.getElementById("country").value);
}

function updateCount(){
  document.getElementById("count").textContent=selectedPixels.size.toLocaleString("hu-HU");
}

function resizeCanvas(){
  const rect=map.getContainer().getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;

  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);
  canvas.style.width=rect.width+"px";
  canvas.style.height=rect.height+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
  requestDraw();
}

function requestDraw(){
  if(drawPending)return;
  drawPending=true;
  requestAnimationFrame(()=>{
    drawPending=false;
    drawPixels();
  });
}

function drawPixels(){
  const width=map.getSize().x;
  const height=map.getSize().y;

  ctx.clearRect(0,0,width,height);

  const zoom=map.getZoom();
  const screenCell=CELL_SIZE*Math.pow(2,zoom);

  if(screenCell<3.5){
    message.textContent="Nagyíts tovább, hogy megjelenjenek a pixelek!";
    return;
  }

  const bounds=map.getPixelBounds(0);
  const minX=bounds.min.x;
  const maxX=bounds.max.x;
  const minY=Math.max(0,bounds.min.y);
  const maxY=Math.min(256,bounds.max.y);

  const firstRow=Math.max(0,Math.floor(minY/CELL_SIZE));
  const lastRow=Math.min(GRID_HEIGHT-1,Math.floor(maxY/CELL_SIZE));

  const firstWorld=Math.floor(minX/256);
  const lastWorld=Math.floor(maxX/256);

  const visibleRows=Math.max(0,lastRow-firstRow+1);
  let estimatedCells=0;

  for(let world=firstWorld;world<=lastWorld;world++){
    const worldStart=world*256;
    const localMin=Math.max(0,minX-worldStart-GRID_START_X);
    const localMax=Math.min(GRID_WIDTH*CELL_SIZE,maxX-worldStart-GRID_START_X);

    if(localMax<0 || localMin>GRID_WIDTH*CELL_SIZE)continue;

    const firstCol=Math.max(0,Math.floor(localMin/CELL_SIZE));
    const lastCol=Math.min(GRID_WIDTH-1,Math.floor(localMax/CELL_SIZE));

    if(lastCol>=firstCol){
      estimatedCells+=(lastCol-firstCol+1)*visibleRows;
    }
  }

  if(estimatedCells>90000){
    message.textContent="Nagyíts még egy kicsit a pixelek megjelenítéséhez.";
    return;
  }

  message.textContent="Válassz zászlót, majd koppints egy pixelre!";

  for(let world=firstWorld;world<=lastWorld;world++){
    const worldStart=world*256;
    const localMin=Math.max(0,minX-worldStart-GRID_START_X);
    const localMax=Math.min(GRID_WIDTH*CELL_SIZE,maxX-worldStart-GRID_START_X);

    if(localMax<0 || localMin>GRID_WIDTH*CELL_SIZE)continue;

    const firstCol=Math.max(0,Math.floor(localMin/CELL_SIZE));
    const lastCol=Math.min(GRID_WIDTH-1,Math.floor(localMax/CELL_SIZE));

    for(let row=firstRow;row<=lastRow;row++){
      for(let col=firstCol;col<=lastCol;col++){
        if(row===GRID_HEIGHT-1 && col>=LAST_ROW_COUNT)continue;

        const id=row*GRID_WIDTH+col;
        const x=worldStart+GRID_START_X+col*CELL_SIZE;
        const y=row*CELL_SIZE;

        const topLeft=map.latLngToContainerPoint(map.unproject([x,y],0));
        const bottomRight=map.latLngToContainerPoint(
          map.unproject([x+CELL_SIZE,y+CELL_SIZE],0)
        );

        const px=topLeft.x;
        const py=topLeft.y;
        const pw=bottomRight.x-topLeft.x;
        const ph=bottomRight.y-topLeft.y;

        if(px>width || py>height || px+pw<0 || py+ph<0)continue;

        const country=selectedPixels.get(id);

        if(country){
          drawFlag(ctx,px,py,pw,ph,country);
        }

        ctx.strokeStyle=country?"rgba(0,0,0,0.55)":"rgba(10,20,30,0.65)";
        ctx.lineWidth=0.65;
        ctx.strokeRect(px,py,pw,ph);
      }
    }
  }
}

function getPixelId(latlng){
  const point=map.project(latlng,0);

  let x=((point.x%256)+256)%256;
  const y=point.y;

  const col=Math.floor((x-GRID_START_X)/CELL_SIZE);
  const row=Math.floor(y/CELL_SIZE);

  if(col<0 || col>=GRID_WIDTH || row<0 || row>=GRID_HEIGHT){
    return null;
  }

  if(row===GRID_HEIGHT-1 && col>=LAST_ROW_COUNT){
    return null;
  }

  if(y<0 || y>256)return null;

  return row*GRID_WIDTH+col;
}

map.on("click",function(event){
  const screenCell=CELL_SIZE*Math.pow(2,map.getZoom());

  if(screenCell<3.5){
    message.textContent="Először nagyíts rá a térképre!";
    return;
  }

  const id=getPixelId(event.latlng);

  if(id===null){
    message.textContent="Ez a terület nem része a pixelrácsnak.";
    return;
  }

  const country=document.getElementById("country").value;

  if(selectedPixels.has(id)){
    selectedPixels.delete(id);
  }else{
    selectedPixels.set(id,country);
  }

  updateCount();
  requestDraw();
});

document.getElementById("country").addEventListener("change",updatePreview);

document.getElementById("clearButton").addEventListener("click",()=>{
  if(confirm("Biztosan törlöd az összes kiválasztott pixelt?")){
    selectedPixels.clear();
    updateCount();
    requestDraw();
  }
});

map.on("move zoom moveend zoomend resize",requestDraw);
window.addEventListener("resize",resizeCanvas);

updatePreview();
updateCount();

setTimeout(()=>{
  map.invalidateSize();
  resizeCanvas();
},300);
</script>
</body>
</html>
